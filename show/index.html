<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<base href="/show/">
<title>Show</title>
<style>
  :root { --ink: #1c1c1e; --muted: rgba(60,60,67,.72); }
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    min-height: 100dvh;
    background: #f2f2f7;
    -webkit-font-smoothing: antialiased;
  }
  button, a { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  .kicker { margin: 0; font-size: 13px; font-weight: 600; color: #8e8e93; }
  h1 { margin: 2px 0 0; font-weight: 700; font-size: 34px; letter-spacing: -0.04em; line-height: 1.05; }
  .cards { display: grid; gap: 14px; margin-top: 22px; }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 1px 1px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.06);
  }
  .card:active { transform: scale(.985); }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #ececf1; }
  .card .body { padding: 14px 16px 16px; }
  .card .when { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: #8e8e93; }
  .card .title { margin: 3px 0 0; font-size: 20px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.2; }
  .card .sub { margin: 4px 0 0; font-size: 14px; line-height: 1.35; color: #636366; }
  .stage { min-height: 100dvh; background: #000; color: #fff; }
  body.stage { background: #000; }
  .bar, .script, .nav, .tools { max-width: 760px; margin-left: auto; margin-right: auto; }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 16px 0;
  }
  .bar button {
    background: rgba(255,255,255,.14);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid rgba(255,255,255,.22);
    color: #fff;
    min-height: 40px;
    padding: 0 14px;
    border-radius: 999px;
  }
  .bar strong { font-weight: 650; font-size: 17px; letter-spacing: -0.02em; }
  .bar span { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.7); font-size: 14px; }
  .tools { display: flex; gap: 8px; padding: 10px 16px 0; overflow-x: auto; }
  .tools button {
    flex: 0 0 auto;
    min-height: 36px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    backdrop-filter: blur(18px) saturate(1.5);
    color: #fff;
  }
  .tools button.on { background: rgba(255,255,255,.92); color: #111; border-color: transparent; }
  .frame { position: relative; margin: 12px 16px 0; border-radius: 22px; background: #111; aspect-ratio: 16/9; }
  .frame img, .frame video { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 22px; background: #111; }
  .vid { position: relative; width: 100%; height: 100%; }
  .vid .clip { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .vid.on .clip { opacity: 1; z-index: 2; }
  .vid.on img { visibility: hidden; }
  .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 68px; height: 68px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.94); color: #111; font-size: 26px; z-index: 3;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .vid.on .play { display: none; }
  .meter { height: 2px; margin: 14px 20px 0; background: rgba(255,255,255,.18); }
  .meter i { display: block; height: 100%; background: #fff; }
  .script {
    margin: 12px 16px 0;
    padding: 18px 18px 16px;
    border-radius: 28px;
    background: rgba(28,28,30,.48);
    -webkit-backdrop-filter: blur(32px) saturate(1.7);
    backdrop-filter: blur(32px) saturate(1.7);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
  }
  .who { margin-bottom: 8px; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.62); }
  .say { margin: 0; font-size: clamp(22px, 5.2vw, 32px); line-height: 1.22; font-weight: 650; letter-spacing: -0.03em; }
  .uz { margin: 10px 0 0; color: rgba(255,255,255,.72); font-size: 16px; line-height: 1.4; }
  .note { margin: 12px 0 0; color: #ffd6c2; font-size: 14px; font-weight: 600; }
  .nav { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .nav button {
    min-height: 50px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.14);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    backdrop-filter: blur(20px) saturate(1.6);
    color: #fff;
    font-weight: 600;
  }
  .nav button.primary { background: rgba(255,255,255,.94); color: #111; border-color: transparent; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const SHOWS = {
  tech: {
    title: "Tech Tonight",
    who: "Maqsudjon",
    slides: [
      { img: "tech-01.jpg", say: "Good evening! Welcome to Tech Tonight. I’m Maqsudjon. Tonight: a car that flies, a taxi with no driver, and an AI that shops for you." },
      { img: "tech-02.jpg", say: "On October 15th, Tesla showed its new Roadster. And this car can fly!" },
      { img: "tech-03.jpg", say: "The internet reacted very fast.", note: "To‘xta. Kulishsin." },
      { img: "tech-04.jpg", video: "tech-fly2.mp4", say: "And this is the real video.", note: "Videoni o‘ynat." },
      { img: "tech-05.jpg", say: "And the Uzbek internet was ready too.", note: "To‘xta. O‘qishsin." },
      { img: "tech-06.jpg", say: "How does it fly? With air! Ten thrusters. Six hundred liters of air. Zero to sixty in under one second. And to reserve one: fifty thousand dollars!" },
      { img: "tech-07.jpg", say: "But is it legal? Elon Musk says: “Depends on your street.”" },
      { img: "tech-08.jpg", say: "So, new road signs are coming.", note: "To‘xta." },
      { img: "tech-09.jpg", say: "And car insurance companies right now…", note: "To‘xta." },
      { img: "tech-10.jpg", say: "Tesla also has a taxi with no driver. In Texas, people already ride in it." },
      { img: "tech-11.jpg", say: "Story two. Meta made Muse: an AI that shops for you. It finds the product and pays for it." },
      { img: "tech-12.jpg", say: "But Amazon said no and blocked it." },
      { img: "tech-13.jpg", say: "A question for you. Raise your hand: who would let an AI spend your money? And who would ride in a car with no driver?", note: "Qo‘l ko‘tarsin." },
      { img: "tech-14.jpg", say: "Cars are learning to fly, and AI is learning to shop. That’s all for Tech Tonight. Thank you for watching!" }
    ]
  },
  games: {
    title: "Asian Games",
    who: "Mubina · Jasmina",
    split: true,
    slides: [
      { img: "games-01.jpg", part: "m", say: "Hello everyone! Today I want to tell you about Uzbekistan at the Asian Games in Japan." },
      { img: "games-02.jpg", part: "m", say: "Let’s start with a quick quiz! How many medals did Uzbekistan win? Thirty, fifty or seventy?", note: "Javobni kut." },
      { img: "games-03.jpg", part: "m", say: "The answer is seventy! Twenty-one gold, twenty-five silver and twenty-four bronze. Uzbekistan finished fifth in Asia!" },
      { img: "games-04.jpg", part: "m", say: "Only China, Japan, South Korea and India were ahead of us. India had the same number of gold medals: twenty-one!" },
      { img: "games-05.jpg", part: "m", say: "It was our biggest team ever: almost four hundred athletes. And one hundred seventy-two of them were women!" },
      { img: "games-06.jpg", part: "j", say: "The first gold came in karate. Abdulvakhob Rashidov beat a Japanese fighter, in Japan!" },
      { img: "games-07.jpg", part: "j", say: "And our girls were amazing! Sharifa Davronova won gold in triple jump, and Pokizaxon Kamoliddinova won gold in wrestling." },
      { img: "games-08.jpg", part: "j", say: "Fun fact: our first Asian Games were also in Japan, in 1994. Then we won forty-two medals. Now: seventy!" },
      { img: "games-09.jpg", part: "j", say: "And right now, one hundred fifty-three Uzbek athletes are at the Asian Para Games in Japan. Good luck to them!" },
      { img: "games-10.jpg", part: "j", say: "Thank you for listening! Do you have any questions?" }
    ]
  },
  greet: {
    title: "Salomlashish",
    who: "Maqsudjon",
    slides: [
      { img: "greet-01.jpg", say: "Здра́вствуйте! Я расскажу́, как здоро́ваются в ра́зных стра́нах.", uz: "Assalomu alaykum! Turli mamlakatlarda qanday salomlashishlarini aytib beraman." },
      { img: "greet-02.jpg", say: "В Тибе́те пока́зывают язы́к. Э́то знак уваже́ния!", uz: "Tibetda til ko‘rsatishadi. Bu hurmat belgisi!", note: "Rasmni ko‘rsat. Jur’at qilsang, tilingni ham." },
      { img: "greet-03.jpg", say: "В Но́вой Зела́ндии здоро́ваются носа́ми. Э́то «хо́нги».", uz: "Yangi Zelandiyada burun bilan salomlashishadi. Bu «hongi».", note: "Rasmni ko‘rsat." },
      { img: "greet-04.jpg", say: "В Япо́нии кла́няются. Чем ни́же покло́н, тем бо́льше уваже́ния. Да́же Оба́ма!", uz: "Yaponiyada ta’zim qilishadi. Ta’zim qancha past bo‘lsa, hurmat shuncha katta. Hatto Obama ham!", note: "Biroz ta’zim qil. Oxirida rasmni ko‘rsat." },
      { img: "greet-05.jpg", say: "В Таила́нде говоря́т «Саватди» и скла́дывают ладо́ни. Э́то «вай».", uz: "Tailandda «Savatdi» deyishadi va kaftlarni birlashtirishadi. Bu «vay».", note: "Kaftlaringni birlashtir." },
      { img: "greet-06.jpg", say: "А мы говори́м «Ассалому алайкум» и кладём ру́ку на се́рдце.", uz: "Biz esa «Assalomu alaykum» deymiz va qo‘lni yurakka qo‘yamiz.", note: "O‘ng qo‘lingni ko‘ksingga qo‘y." },
      { img: "greet-07.jpg", say: "Спаси́бо за внима́ние!", uz: "E’tiboringiz uchun rahmat!", note: "Yaponlardek ta’zim qil." }
    ]
  },
  charlie: {
    title: "Card Collector",
    who: "Maqsudjon",
    slides: [
      { img: "charlie-01.jpg", say: "Today I want to tell you about a YouTuber who collects cards. His name is Charlie White." },
      { img: "charlie-02.jpg", say: "Charlie White is a famous American YouTuber and streamer. People also know him as penguinz0, or MoistCr1TiKaL." },
      { img: "charlie-03.jpg", say: "What does he collect? Trading cards. Especially Yu-Gi-Oh! and Pokémon. Dark Magician, Blue-Eyes White Dragon, and Charizard." },
      { img: "charlie-04.jpg", say: "In 2019, he started opening card packs on his live streams. Over the years, he has spent thousands of dollars on cards. In 2022, he posted a video called It’s Time I Finally Admit It, and showed his Yu-Gi-Oh! collection." },
      { img: "charlie-05.jpg", say: "The collection has every Ultra Rare and rarer card ever printed, all in first edition. That includes a first-edition Legend of Blue-Eyes White Dragon, and all sixty Collector’s Rares. He has put many cards in frames on the walls of his studio." },
      { img: "charlie-06.jpg", say: "Charlie often jokes that collecting cards is his addiction. But he has also made money from it, because millions of people have watched his videos." },
      { img: "charlie-07.jpg", say: "Now the grammar. Present perfect: no exact time, the result is now. He has spent thousands of dollars. He has put his cards in frames. People have watched his videos. Past simple: exact past time. He started opening packs in 2019. He posted a video in 2022. He showed his collection." },
      { img: "charlie-08.jpg", say: "Thank you. Any questions?" }
    ]
  }
};

const app = document.getElementById("app");
let part = "all";
let hide = false;
let index = 0;

function esc(s) {
  var amp = String.fromCharCode(38) + "amp;";
  var lt = String.fromCharCode(38) + "lt;";
  var gt = String.fromCharCode(38) + "gt;";
  var quot = String.fromCharCode(38) + "quot;";
  return String(s).replace(/[&<>"]/g, function (c) {
    if (c === "&") return amp;
    if (c === "<") return lt;
    if (c === ">") return gt;
    return quot;
  });
}

function deckOf(show) {
  if (!show.split || part === "all") return show.slides.map((s, i) => ({ ...s, n: i }));
  const want = part === "m" ? "m" : "j";
  return show.slides.map((s, i) => ({ ...s, n: i })).filter(s => s.part === want);
}

function render() {
  const hash = location.hash.replace("#", "");
  const [id, raw] = hash.split("/");
  const show = SHOWS[id];
  if (!show) return home();
  const deck = deckOf(show);
  index = Math.max(0, Math.min(deck.length - 1, (parseInt(raw, 10) || 1) - 1));
  const slide = deck[index];
  const who = slide.part === "m" ? "Mubina · 1–5" : slide.part === "j" ? "Jasmina · 6–10" : "";
  document.body.className = "stage";
  document.querySelector('meta[name="theme-color"]').content = "#000000";
  const media = slide.video
    ? `<div class="vid"><img src="media/${slide.img}" alt=""><button type="button" class="play" id="playvid">▶</button><video class="clip" src="media/${slide.video}" playsinline webkit-playsinline preload="auto"></video></div>`
    : `<img src="media/${slide.img}" alt="">`;
  app.innerHTML = `
    <div class="bar">
      <button id="back">Kundalik</button>
      <strong>${esc(show.title)}</strong>
      <span>${index + 1}/${deck.length}</span>
    </div>
    <div class="tools">
      ${show.split ? `
        <button data-part="all" class="${part === "all" ? "on" : ""}">Ikkalasi</button>
        <button data-part="m" class="${part === "m" ? "on" : ""}">Mubina</button>
        <button data-part="j" class="${part === "j" ? "on" : ""}">Jasmina</button>
      ` : ""}
      <button id="hide" class="${hide ? "on" : ""}">${hide ? "Matnni och" : "Matnni yashir"}</button>
    </div>
    <div class="frame" id="frame">${media}</div>
    <div class="meter"><i style="width:${Math.round(((index + 1) / deck.length) * 100)}%"></i></div>
    <div class="script ${hide ? "hidden" : ""}">
      ${who ? `<div class="who">${who}</div>` : ""}
      <p class="say">${esc(slide.say)}</p>
      ${slide.uz ? `<p class="uz">${esc(slide.uz)}</p>` : ""}
      ${slide.note ? `<p class="note">${esc(slide.note)}</p>` : ""}
    </div>
    <div class="nav">
      <button id="prev">Oldingi</button>
      <button id="next" class="primary">${index + 1 === deck.length ? "Tugadi" : "Keyingi"}</button>
    </div>`;
  document.getElementById("back").onclick = () => { location.hash = ""; };
  document.getElementById("prev").onclick = () => go(index - 1, deck);
  document.getElementById("next").onclick = () => go(index + 1, deck);
  document.getElementById("hide").onclick = () => { hide = !hide; render(); };
  app.querySelectorAll("[data-part]").forEach(b => b.onclick = () => {
    part = b.dataset.part;
    location.hash = id + "/1";
    render();
  });
  const play = document.getElementById("playvid");
  if (play) {
    play.onclick = () => {
      const box = play.parentElement;
      const v = box.querySelector("video");
      box.classList.add("on");
      v.controls = true;
      const goPlay = v.play();
      if (goPlay) goPlay.catch(() => {});
    };
  }
  const frame = document.getElementById("frame");
  let x0 = 0;
  frame.ontouchstart = e => { x0 = e.changedTouches[0].clientX; };
  frame.ontouchend = e => {
    const dx = e.changedTouches[0].clientX - x0;
    if (dx > 50) go(index - 1, deck);
    if (dx < -50) go(index + 1, deck);
  };
}

function go(next, deck) {
  const id = location.hash.replace("#", "").split("/")[0];
  if (next < 0) return;
  if (next >= deck.length) { location.hash = ""; return; }
  location.hash = id + "/" + (next + 1);
}

function home() {
  document.body.className = "";
  document.querySelector('meta[name="theme-color"]').content = "#f2f2f7";
  const items = [
    { href: "#tech/1", img: "media/tech-01.jpg", when: "20 oktabr · English", title: "Tech Tonight", sub: "Hamidulla · 14 slayd" },
    { href: "#games/1", img: "media/games-01.jpg", when: "20 oktabr · English", title: "Asian Games", sub: "Mubina 1–5 · Jasmina 6–10" },
    { href: "#greet/1", img: "media/greet-01.jpg", when: "22 oktabr · Rus tili", title: "Salomlashish", sub: "Manzura · 7 slayd" },
    { href: "#charlie/1", img: "media/charlie-01.jpg", when: "23 oktabr · English", title: "Card Collector", sub: "Sitora · 8 slayd" }
  ];
  app.innerHTML = `
    <div class="wrap">
      <p class="kicker">Maqsudjon</p>
      <h1>Show</h1>
      <div class="cards">
        ${items.map((it) => `<a class="card" href="${it.href}"><img src="${it.img}" alt=""><div class="body"><p class="when">${esc(it.when)}</p><p class="title">${esc(it.title)}</p><p class="sub">${esc(it.sub)}</p></div></a>`).join("")}
      </div>
    </div>`;
}

window.addEventListener("hashchange", render);
document.addEventListener("keydown", e => {
  if (!location.hash) return;
  const id = location.hash.replace("#", "").split("/")[0];
  const deck = deckOf(SHOWS[id]);
  if (e.key === "ArrowRight") go(index + 1, deck);
  if (e.key === "ArrowLeft") go(index - 1, deck);
});
render();
</script>
</body>
</html>
